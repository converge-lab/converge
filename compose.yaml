# Quickstart:
#   docker compose up --build
#   docker compose exec staw staw-server token mint   # your bearer token
# then open http://127.0.0.1:8080 and/or connect an MCP client to
# http://127.0.0.1:8080/mcp with `Authorization: Bearer <token>`.
#
# Authentication is always on. The port is published on the host loopback
# only — keep it that way, or behind TLS on a network you trust.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: staw
      POSTGRES_PASSWORD: staw
      POSTGRES_DB: staw
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staw"]
      interval: 2s
      timeout: 2s
      retries: 15

  staw:
    build: .
    environment:
      STAW_DATABASE_URL: postgres://staw:staw@postgres/staw
      # The identity /users/me resolves to (and MCP authorship records):
      STAW_USER__HANDLE: admin
      STAW_USER__NAME: Admin
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
