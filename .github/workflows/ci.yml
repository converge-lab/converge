name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

env:
  # Compile against the committed .sqlx cache; never reach for a live DB.
  # The `sqlx` job is the one place the cache itself is verified.
  SQLX_OFFLINE: "true"

jobs:
  check:
    # `cargo check` on MSRV and stable first — the pushed code at least compiles.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.88", stable]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-features --bins --tests --benches

  test:
    # Integration tests boot Postgres via testcontainers (Docker is
    # preinstalled on ubuntu runners).
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --all-features --exclude converge-e2e

  e2e:
    # Real Converge and agent CLIs run only inside disposable containers.
    # Every suite builds its own images — a release build of the server and
    # sqlx-cli from source among them — so the budget is generous.
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: End-to-end suites
        # One test at a time: each stands up its own container set, and a
        # runner cannot carry several of them at once.
        run: cargo test -p converge-e2e --all-features -- --test-threads=1

  sqlx:
    # A stale query cache compiles fine offline but lies about the schema —
    # regenerate against a fresh Postgres and fail on any drift.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Verify committed .sqlx is current
        run: cargo xtask prepare --check
        env:
          SQLX_OFFLINE: "false"

  wasm:
    # The client must keep compiling for the browser (the web UI consumes
    # it); UI crates join this check as they land.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check wasm crates
        run: cargo check -p converge-client -p converge-ui -p converge-web --all-features --target wasm32-unknown-unknown
      - name: Clippy wasm crates
        run: cargo clippy -p converge-ui -p converge-web --all-features --target wasm32-unknown-unknown -- -D warnings

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-features --bins --examples --tests --benches -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        run: cargo fmt --all -- --check

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
